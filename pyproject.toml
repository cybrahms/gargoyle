[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gargoyle-traces"
version = "0.1.0"
description = "A live terminal inspector for retained OpenTelemetry traces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "cybrahms"}]
dependencies = ["textual>=8.2.8,<9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
]

[project.scripts]
gargoyle = "gargoyle.cli:main"

[project.urls]
Repository = "https://github.com/cybrahms/gargoyle"
Issues = "https://github.com/cybrahms/gargoyle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gargoyle"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py311"
