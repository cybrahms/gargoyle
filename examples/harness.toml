# Add to your global harness.d directory; replace paths for your machine.
# The command must be on the daemon's PATH; use an absolute path if necessary.
[harness.scope]
harness = "generic"
args = ["-c", "export TERM=xterm-256color COLORTERM=truecolor; exec scope view --input /path/to/trace-exports"]
enabled = true
restart = "always"
export_telemetry = false
description = "Scope — live OTLP trace inspector"

# Optional receiver. Use the same directory as the inspector above.
[harness.scope-receiver]
harness = "generic"
args = ["-c", "exec scope receive --output /path/to/trace-exports"]
enabled = true
restart = "always"
export_telemetry = false
description = "Scope — local OTLP/HTTP receiver to disk"
